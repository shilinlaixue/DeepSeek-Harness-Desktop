name: Release macOS

on:
  push:
    tags:
      - 'mac-v*'

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build app and DMG
        shell: bash
        env:
          DSH_VERSION: '0.2.1-rc.2'
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify DMG exists
        shell: bash
        run: ls -l DeepSeek-*.dmg

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: DeepSeek-*.dmg
          fail_on_unmatched_files: true
          name: DeepSeek Desktop for Mac ${{ github.ref_name }}
          generate_release_notes: true
