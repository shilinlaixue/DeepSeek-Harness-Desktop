name: Release Windows

on:
  push:
    tags:
      - 'win-v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build self-contained app + runtime + self-test
        shell: pwsh
        run: pwsh scripts/build-windows.ps1 -Version 1.1.0

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc DeepSeekSetup.iss
          if (-not (Test-Path "dist/DeepSeek-Setup-1.1.0.exe")) { throw "installer build failed" }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DeepSeek-1.1.0-win-x64.zip
            dist/DeepSeek-1.1.0-win-x64.zip.sha256
            dist/DeepSeek-Setup-1.1.0.exe
          fail_on_unmatched_files: true
          name: DeepSeek for Windows ${{ github.ref_name }}
          generate_release_notes: true
